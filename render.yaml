services:
  - type: web
    name: college-campus-fastapi-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python -c 'from app.seed import seed_database; seed_database()'"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
